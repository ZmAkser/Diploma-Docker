name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  YCR_REGISTRY: cr.yandex/crpn809cfrp4igmmgicn
  IMAGE_NAME: app

jobs:
  build-and-push:
    name: Build and push to YCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YCR_JSON_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.YCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.YCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to remote server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            docker pull ${{ env.YCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop ${{ env.IMAGE_NAME }} 2>/dev/null || true
            docker rm   ${{ env.IMAGE_NAME }} 2>/dev/null || true
            docker run -p 8080:80 -d \
              --name ${{ env.IMAGE_NAME }} \
              --restart unless-stopped \
              ${{ env.YCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
